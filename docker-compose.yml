services:
     redis:
          image: redis:7-alpine
          container_name: redis
          restart: unless-stopped
          ports:
               - '127.0.0.1:6379:6379'
          command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis123}
          volumes:
               - redis_data:/data
          healthcheck:
               test: ['CMD-SHELL', 'REDISCLI_AUTH="${REDIS_PASSWORD:-redis123}" redis-cli --raw incr ping']
               interval: 10s
               timeout: 5s
               retries: 5
               start_period: 30s

volumes:
     redis_data:
          driver: local
